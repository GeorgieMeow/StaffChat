name: StaffChat
description: $description
version: '${version}'

main: com.github.GeorgieMeow.staffChat.StaffChat
api-version: '1.21.11'
load: POSTWORLD

authors: [ GeorgieMeow ]

commands:
  ToggleStaffChat:
    description: Switch your chat to a private staff chat!
    usage: /<command>
    aliases: [togglestaffchat, tsc]

  MessageStaff:
    description: send a chat message to staff chat without having to be in staff chat!
    usage: /<command> [Message]
    aliases: [messagestaff, ms]

permissions:
  StaffChat.isStaff:
    description: Allows switching to staff chat!
    default: op

