name: StaffChat
description: $description
version: '${version}'

main: com.github.GeorgieMeow.staffChat.StaffChat
api-version: '1.21.11'
load: POST WORLD

authors: [ GeorgieMeow ]

commands:
  StaffChat:
    description: Switch your chat to a private staff chat!
    usage: /<command> [message/togglechat]
    aliases: [staffchat, sc]

permissions:
  StaffChat.isStaff:
    description: Allows switching to staff chat!
    default: op

    softdepend:
      -LuckPerms

